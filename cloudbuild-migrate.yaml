# Builds the migrate job image (migrate/Dockerfile) and pushes it to Artifact Registry. Used by scripts/migrate-job.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'migrate/Dockerfile', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
substitutions:
  _IMAGE: ''
options:
  logging: CLOUD_LOGGING_ONLY
