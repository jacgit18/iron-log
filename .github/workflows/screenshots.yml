name: README screenshots

# Regenerates the README images with sample data whenever the app or the screenshot tooling changes.
# On a pull request it only comments before/after/diff images against the published set, so nobody has
# to take screenshots by hand; the comparison images live on the pr-screenshots branch.
# After a merge to main it publishes the new set to the readme-images branch, which the README links to.
# The images are never committed to main or to a feature branch: two branches each committing their own
# copy of a PNG made the second merge conflict, since git cannot merge binary files.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tools/**'
      - '.github/workflows/screenshots.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tools/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write
  pull-requests: write

# One run per branch; a newer push cancels the older run.
concurrency:
  group: screenshots-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A commit, not a branch name: the branch may already be deleted if the PR was merged quickly.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/install-chromium
      - run: npm run screenshots
      - name: Compare with the published images and comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          if git fetch -q --depth 1 origin readme-images; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/base"; fi
          OUT="$RUNNER_TEMP/pr-$PR"
          PREFIX="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/pr-screenshots/pr-$PR/"
          node tools/visual-diff.mjs "$RUNNER_TEMP/base" docs/images "$OUT" "$PREFIX"
          # Publish the comparison images (replacing any from an earlier push of this PR).
          PUB="$RUNNER_TEMP/pub"
          git clone --depth 1 --branch pr-screenshots "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$PUB" 2>/dev/null \
            || { git init -q "$PUB"; git -C "$PUB" checkout -q -b pr-screenshots; git -C "$PUB" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"; }
          # Other PRs publish to the same branch, so a push can be rejected when one lands first.
          # Then start again from the branch as it is now and redo only this PR's folder; nothing to rebase or merge.
          publish() {
            rm -rf "$PUB/pr-$PR"; mkdir -p "$PUB/pr-$PR"; cp "$OUT"/*.png "$PUB/pr-$PR/" 2>/dev/null || true
            git -C "$PUB" add -A
            if git -C "$PUB" diff --cached --quiet; then return 0; fi
            git -C "$PUB" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Screenshots for PR $PR" \
              && git -C "$PUB" push -q origin pr-screenshots
          }
          for TRY in 1 2 3 4 5; do
            if publish; then break; fi
            if [ "$TRY" = 5 ]; then echo "Could not push to pr-screenshots after $TRY tries"; exit 1; fi
            echo "pr-screenshots moved on (try $TRY); retrying"
            sleep $((TRY * 3))
            git -C "$PUB" fetch -q --depth 1 origin pr-screenshots && git -C "$PUB" reset -q --hard FETCH_HEAD
          done
          # One comment per PR, updated in place.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '[.[] | select(.body | contains("<!-- visual-diff -->"))][0].id // empty')
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@"$OUT/comment.md" >/dev/null
          else gh pr comment "$PR" --body-file "$OUT/comment.md"; fi
      # Only main publishes, one run at a time (concurrency above), so nothing else pushes to readme-images.
      - name: Publish to the readme-images branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUB="$RUNNER_TEMP/readme-images"
          git clone -q --depth 1 --branch readme-images "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$PUB" 2>/dev/null \
            || { git init -q "$PUB"; git -C "$PUB" checkout -q -b readme-images; git -C "$PUB" remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"; }
          rm -f "$PUB"/*.png; cp docs/images/*.png "$PUB/"
          git -C "$PUB" add -A
          if git -C "$PUB" diff --cached --quiet; then echo "Images unchanged"; exit 0; fi
          git -C "$PUB" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "README screenshots for $GITHUB_SHA"
          git -C "$PUB" push -q origin readme-images
