name: README screenshots

# Regenerates docs/images/ on feature branches whenever the app or the
# screenshot tooling changes, and commits the result back to that branch.
# The data branch only holds the app's GitHub backups, so it's left alone.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, data]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tools/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

# One run per branch; a newer push cancels the older run.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/screenshots.mjs
      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then echo "Images unchanged"; exit 0; fi
          git commit -m "Update README screenshots"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
