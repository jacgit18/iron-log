name: README screenshots

# Regenerates docs/images/ on feature branches whenever the app or the
# screenshot tooling changes, and commits the result back to that branch.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'js/**'
      - 'assets/**'
      - 'tools/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/screenshots.mjs
      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then echo "Images unchanged"; exit 0; fi
          git commit -m "Update README screenshots"
          git push
