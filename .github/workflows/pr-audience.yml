name: PR audience

# A pull request must say who can see its change: tick exactly one box under "Audience" in the PR description
# (.github/pull_request_template.md). Fails when none, or more than one, is ticked. Bots (README screenshots, Dependabot) are skipped.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  audience:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Exactly one audience box is ticked
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          section="$(printf '%s\n' "$BODY" | sed -n '/^## Audience/,/^## /p')"
          ticked="$(printf '%s\n' "$section" | grep -ciE '^\s*- \[x\]' || true)"
          if [ "$ticked" -ne 1 ]; then
            echo "::error title=Audience not chosen::Tick exactly one box under \"Audience\" in the PR description (n/a, admin only, or everyone). Found $ticked."
            exit 1
          fi
          echo "Audience chosen."
