name: Release

# Pushing a version tag (v1.0.0-alpha.1, v1.0.0-beta.1, v1.0.0-rc.1, v1.0.0, ...) creates the GitHub Release for it, with notes
# GitHub writes from the pull requests merged since the previous tag. Stages and how to cut a release: ADR 032.
# It only releases a tag on main, and leaves a tag alone when its release already exists (made by hand on github.com).
# It does not deploy: deploy-cloud-run.yml still ships every merge to main.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; tag a commit on main."
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
