name: Tests

# Lints, runs the unit tests and the browser (Playwright) tests on every pull request, so problems show up
# before merging instead of stopping the deploy afterwards. The database job checks the migrations on a throwaway
# Postgres: they apply, roll back to an empty schema, apply again, and server/db/types.ts matches them. The docker job
# builds the production image and checks that it starts and serves the API and the app. The e2e-sync job runs the app with
# syncing on against the real API and a real Postgres, nothing mocked.
# It also runs on main after a merge, so the deploy (deploy-cloud-run.yml) waits for tests that passed on exactly the commit it ships.
# A pull request runs only the jobs its changed files need (scripts/ci-changes.mjs decides; a docs-only PR runs none, a file it
# does not recognise runs all). A push to main and a manual run always run every job: that is the full gate before a deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      unit: ${{ steps.pick.outputs.unit }}
      e2e: ${{ steps.pick.outputs.e2e }}
      e2e_sync: ${{ steps.pick.outputs.e2e_sync }}
      database: ${{ steps.pick.outputs.database }}
      backup: ${{ steps.pick.outputs.backup }}
      docker: ${{ steps.pick.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        run: node scripts/ci-changes.mjs

  test:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-26.04
    steps:
      # Full history: scripts/parityRun.test.js reads HEAD~2 (a shallow checkout has no such commit).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Every unit test, with coverage, on pull requests and on main (ADR 069): the floors and the cap on files no test loads only mean something over the whole suite. `npm run check` still runs just the related tests locally.
      - run: npm run coverage

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg APP_VERSION=$(git log -1 --format=%ct) -t iron-log .
      # No database here: the health check and the app need none. The image runs as production, which now refuses to start without a valid
      # database key (server/auth/piiBootCheck.ts), so it gets a throwaway one; with no database there is no sealed value to check it against.
      - name: Start the image and check it answers
        run: |
          docker run -d --name app -p 8080:8080 -e PII_ENCRYPTION_KEY="$(openssl rand -base64 32)" iron-log
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/some/page
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing-1.js)" = 404
          docker exec app id -u | grep -vx 0
      - name: Show the container log
        if: always()
        run: docker logs app

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ironlog
          POSTGRES_PASSWORD: ironlog
          POSTGRES_DB: ironlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironlog"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:check
        env:
          DATABASE_URL: postgres://ironlog:ironlog@127.0.0.1:5432/ironlog?sslmode=disable

  # The nightly backup and the restore check keep working: back up a migrated database that holds a few rows, restore the dump into
  # a throwaway server, and compare every table's row count with the manifest. (Phase F.)
  backup:
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ironlog
          POSTGRES_PASSWORD: ironlog
          POSTGRES_DB: ironlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironlog"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ironlog:ironlog@127.0.0.1:5432/ironlog?sslmode=disable
      DBMATE_NO_DUMP_SCHEMA: 'true'
      DBMATE_MIGRATIONS_DIR: db/migrations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx dbmate up
      - name: Put a few rows in
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into users (auth_user_id) values ('ci-user')"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into log_entries (user_id, client_id, seq, exercise_id, d, auto) select id, 'ci-' || g, g, 'squat', '2026-10-05', false from users, generate_series(1, 25) g"
      - run: docker build -f backup/Dockerfile -t iron-log-backup .
      - name: Back up to a folder
        run: |
          mkdir -p "$RUNNER_TEMP/backups"
          docker run --rm --network host -u "$(id -u):$(id -g)" -v "$RUNNER_TEMP/backups:/out" \
            -e BACKUP_OUT_DIR=/out -e BACKUP_DATABASE_URL="$DATABASE_URL" iron-log-backup
      - name: Restore it and compare
        run: scripts/restore-check.sh "$(ls "$RUNNER_TEMP"/backups/*.dump)"

  e2e-sync:
    needs: changes
    if: needs.changes.outputs.e2e_sync == 'true'
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ironlog
          POSTGRES_PASSWORD: ironlog
          POSTGRES_DB: ironlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironlog"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Makes and drops its own scratch database on this server.
      - run: npm run e2e:sync
        env:
          DATABASE_URL: postgres://ironlog:ironlog@127.0.0.1:5432/ironlog?sslmode=disable
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-sync
          path: |
            playwright-report-sync
            test-results-sync
          retention-days: 7

  # Four shards run side by side, so the browser tests finish in about a quarter of the time. Each shard installs and builds on its own runner.
  e2e-shards:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
      # The built app, so a reviewer can download it and click through the change (npx vite preview). One shard is enough.
      - run: npm run build
        if: matrix.shard == 1
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 1
        with:
          name: app-preview
          path: dist
          retention-days: 7

  # The "Protect main" ruleset requires a check named `e2e`; the shards are named `e2e (1)` to `e2e (4)`, so this one job stands for them.
  # It passes when the shards passed or were skipped (a PR that needs no browser tests) and fails when any shard failed or was cancelled.
  # It also needs `changes`: every test job is skipped when `changes` fails, and "skipped" would then read as a pass, so `changes` must itself have succeeded.
  e2e:
    needs: [changes, e2e-shards]
    if: always()
    runs-on: ubuntu-26.04
    env:
      CHANGES: ${{ needs.changes.result }}
      SHARDS: ${{ needs.e2e-shards.result }}
    steps:
      - run: |
          echo "changes: $CHANGES, e2e shards: $SHARDS"
          test "$CHANGES" = success
          test "$SHARDS" = success || test "$SHARDS" = skipped
