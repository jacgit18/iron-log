name: Tests

# Lints, runs the unit tests and the browser (Playwright) tests on every pull request, so problems show up
# before merging instead of stopping the deploy afterwards.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t iron-log .
      # No database here: the health check and the app need none.
      - name: Start the image and check it answers
        run: |
          docker run -d --name app -p 8080:8080 iron-log
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/some/page
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing-1.js)" = 404
          docker exec app id -u | grep -vx 0
      - name: Show the container log
        if: always()
        run: docker logs app

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      # The built app, so a reviewer can download it and click through the change (npx vite preview).
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-preview
          path: dist
          retention-days: 7
