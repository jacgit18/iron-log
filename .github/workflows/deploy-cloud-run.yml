name: Deploy to Cloud Run

# After a merge to main, once the Tests workflow has passed on that exact commit, builds the image and deploys it to Cloud Run
# (scripts/deploy-cloud-run.sh), checks the new revision answers, and rolls back to the previous one if it does not.
#
# No keys are stored in GitHub: it signs in to Google with Workload Identity Federation, which only accepts this repository on the main
# branch (set up once by scripts/ci-deploy-setup.sh, which also prints the three repository variables this reads).
#
# It never touches the database. A new migration must be applied to production BEFORE the code that needs it (runbook section 8),
# so when migrations were added since the live revision it stops and says so. Apply them, then run this workflow by hand
# (Actions -> Deploy to Cloud Run -> Run workflow) and tick the box.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      migrations_applied:
        description: 'I have applied any new database migration to production (runbook section 8)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    # Only a successful Tests run for a push to main of this repository, or a person starting it by hand on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings -> Environments -> production) to approve each deploy by hand.
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: us-central1
      SERVICE: iron-log
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit whose tests passed, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: What is live now
        id: live
        run: |
          image="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          {
            echo "image=$image"
            echo "sha=${image##*:}"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"
          echo "Live: $image"

      - name: Stop if a migration is waiting
        if: ${{ !inputs.migrations_applied }}
        run: |
          set +e
          waiting="$(scripts/ci-deploy.sh pending-migrations "${{ steps.live.outputs.sha }}")"
          code=$?
          if [ "$code" = 3 ]; then
            echo "::error title=A database migration is waiting::These migrations were added since the live revision. Apply them to production first (runbook section 8), then run this workflow by hand and tick the box."
            echo "$waiting"
            exit 1
          elif [ "$code" != 0 ]; then
            echo "::error title=Cannot tell whether a migration is waiting::The live revision's commit is not in this checkout. Check by hand (runbook section 8), then run this workflow by hand and tick the box."
            exit 1
          fi
          echo "No migration waiting."

      - name: Build and deploy
        run: scripts/deploy-cloud-run.sh deploy

      - name: Check the new revision, and roll back if it is not healthy
        run: |
          url="https://${SERVICE}-$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)').${REGION}.run.app"
          if scripts/ci-deploy.sh smoke "$url"; then exit 0; fi
          echo "::error title=The new revision failed its check::Rolling back to ${{ steps.live.outputs.revision }}."
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "${{ steps.live.outputs.revision }}=100"
          exit 1
