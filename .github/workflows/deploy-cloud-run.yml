name: Deploy to Cloud Run

# After a merge to main, once the Tests workflow has passed on that exact commit, the `staging` job deploys it to the staging service
# first (ADRs 055 to 058): it migrates the staging database, deploys a revision with no traffic, checks it, promotes it and checks the
# live staging service. Only when that passes does the `deploy` job (production) start; the `production` environment's required reviewer
# approves it (ADR 017). Production builds nothing twice: it reuses the image staging built for the same commit.
#
# The production job builds (or reuses) the image and deploys it to Cloud Run (scripts/deploy-cloud-run.sh) as a revision with no
# traffic, checks it on its own address, and only then sends it traffic. If the live service fails its check afterwards it rolls back
# to the previous revision.
#
# No keys are stored in GitHub: it signs in to Google with Workload Identity Federation, which only accepts this repository on the main
# branch (set up once by scripts/ci-deploy-setup.sh, which also prints the three repository variables this reads).
#
# The production job migrates production's database itself, after the approval (brief production-migrates-in-deploy): it asks the database which
# migrations wait, refuses a destructive one (apply it by hand: runbook section 8), backs production up, applies the rest and checks none is left,
# then deploys. The staging job migrates the staging database the same way before it.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_staging:
        description: 'Emergency only: deploy to production without going through staging (a hotfix when staging itself is what is broken). Production still needs its approval'
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write # Workload Identity Federation

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  # Says why the deploy below was skipped, so a forgotten pause is visible in the run summary.
  paused:
    if: github.event_name == 'workflow_run' && vars.DEPLOY_PAUSED == 'true'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "### Deploys are paused (DEPLOY_PAUSED=true)" >> "$GITHUB_STEP_SUMMARY"
          echo "This merge was not deployed. To ship everything on main in one deploy: unpause with \`gh variable set DEPLOY_PAUSED --body false\`, then run \`gh workflow run deploy-cloud-run.yml --ref main\`." >> "$GITHUB_STEP_SUMMARY"

  # Staging (ADRs 055 to 058). It runs before production and needs no approval. Production waits for it (`needs: staging`) unless a person
  # starts the workflow by hand and ticks "skip staging". It is off until the repository variable STAGING_ENABLED is `true` (set it
  # after the setup in runbook section 21): until then this job is skipped and production deploys as it did before staging existed.
  staging:
    if: >-
      vars.STAGING_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.skip_staging != true) ||
      (github.event_name == 'workflow_run' && vars.DEPLOY_PAUSED != 'true' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    environment: staging
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: us-central1
      IRON_LOG_ENV: staging
      SERVICE: iron-log-staging
      BUILD_SA: iron-log-build@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit whose tests passed, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      # Re-running an old green Tests run would deploy that old commit (audit C-3): after a merge lands, the newer run takes over and this one stops here.
      - name: Refuse a commit that is not main's tip
        if: github.event_name == 'workflow_run'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "::error::This commit is not main's tip; re-run on the latest Tests run"; exit 1; }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the database tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The staging database must carry the mark `scripts/staging-db.mjs clear --apply` leaves, so a connection string that points at the
      # wrong database (production's) stops here, before a single migration runs.
      - name: Check the database is the staging one
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/staging-db.mjs check

      # Every migration is tried here before production sees it (ADR 017). dbmate applies only what the staging database has not run.
      - name: Apply migrations to the staging database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx dbmate --no-dump-schema --migrations-dir db/migrations up

      # Build, deploy with no traffic, check, promote, check live, and put the old revision back on a failure: the steps staging and QA share.
      - name: Deploy and check the staging revision
        id: deploy
        uses: ./.github/actions/deploy-candidate
        with:
          label: staging
          scripts: ${{ github.workspace }}/scripts
          working-directory: ${{ github.workspace }}
          failure-note: Production will not deploy.

      - name: Say that staging passed
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Staging passed"
            echo "Commit \`$(git rev-parse --short HEAD)\`: migrations applied to the staging database, the new revision passed its check with no traffic, and the live staging service passed its check at $URL."
            echo "Production is next, and waits for your approval."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Only a successful Tests run for a push to main of this repository, or a person starting it by hand on main.
    # A repository variable DEPLOY_PAUSED=true skips the automatic runs only; a person starting it by hand is never blocked.
    # Staging must have passed (ADR 058). It may be skipped only while STAGING_ENABLED is not `true` (staging not set up yet), or by a person
    # who ticked "skip staging" when starting the workflow by hand. A staging job that ran and failed always blocks production.
    needs: staging
    if: >-
      always() &&
      (needs.staging.result == 'success' ||
       (needs.staging.result == 'skipped' && (vars.STAGING_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.skip_staging == true)))) &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && vars.DEPLOY_PAUSED != 'true' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    # Add required reviewers to this environment (Settings -> Environments -> production) to approve each deploy by hand.
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: us-central1
      SERVICE: iron-log
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit whose tests passed, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      # Re-running an old green Tests run would deploy that old commit (audit C-3): after a merge lands, the newer run takes over and this one stops here.
      - name: Refuse a commit that is not main's tip
        if: github.event_name == 'workflow_run'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "::error::This commit is not main's tip; re-run on the latest Tests run"; exit 1; }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      # The revision that has the traffic, not the latest one: a candidate that failed its check is the latest but never served anyone.
      - name: What is live now
        id: live
        run: |
          revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json \
            | python3 -c 'import json,sys; t=json.load(sys.stdin)["status"]["traffic"]; print(max(t, key=lambda x: x.get("percent", 0))["revisionName"])')"
          # A revision keeps its image as a digest, so the commit is read from the COMMIT_SHA setting the deploy puts on it.
          sha="$(gcloud run revisions describe "$revision" --project "$PROJECT_ID" --region "$REGION" --format=json \
            | python3 -c 'import json,sys; e=json.load(sys.stdin)["spec"]["containers"][0].get("env", []); print(next((x.get("value", "") for x in e if x["name"] == "COMMIT_SHA"), ""))')"
          # Revisions made before COMMIT_SHA existed: the service keeps the image tag (the commit) of its LATEST revision, which is
          # the live one only when no newer revision has been made since.
          if [ -z "$sha" ] && [ "$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestCreatedRevisionName)')" = "$revision" ]; then
            image="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
            sha="${image##*:}"
          fi
          # Anything that is not a commit id leaves it empty, and the migration check then stops and says it cannot tell.
          case "$sha" in *[!0-9a-f]*) sha="";; esac
          {
            echo "sha=$sha"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"
          echo "Live: $revision (commit ${sha:-unknown})"

      # Production migrates here, after the approval (brief production-migrates-in-deploy). Which migrations are waiting is asked of the database
      # itself with the read-only login (MIGRATIONS_CHECK_URL, the same login the parity report uses). If any: a migration that drops, renames,
      # truncates or deletes is refused (scripts/migration-guard.mjs: apply it by hand with scripts/prod-db.sh migrate --apply, runbook section 8),
      # the owner login is checked to be the same database, the backup job runs and must succeed, the migrations are applied, and the run checks
      # none is left. Only then is the revision built and deployed. With nothing waiting these steps do nothing.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the database tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Which migrations are waiting
        id: waiting
        env:
          MIGRATIONS_CHECK_URL: ${{ secrets.MIGRATIONS_CHECK_URL }}
        run: |
          set +e
          if [ -z "$MIGRATIONS_CHECK_URL" ]; then
            echo "::error title=No way to ask the database::MIGRATIONS_CHECK_URL (a read-only login on production, environment production) is not set. Set it as runbook section 24 says, then run this workflow again."
            exit 1
          fi
          waiting="$(node scripts/db-pending.mjs)"
          code=$?
          if [ "$code" = 0 ]; then echo "Production has every migration (asked the database)."; echo "any=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" = 3 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$waiting" > "$RUNNER_TEMP/waiting.txt"
            echo "Waiting for production:"; echo "$waiting"
            exit 0
          fi
          echo "::error title=Could not ask the database which migrations it has::Check by hand with npm run prod:db -- pending, then run this workflow again."
          exit 1
      - name: Refuse a destructive migration
        if: steps.waiting.outputs.any == 'true'
        run: |
          set +e
          mapfile -t files < "$RUNNER_TEMP/waiting.txt"
          out="$(node scripts/migration-guard.mjs "${files[@]}")"
          code=$?
          if [ "$code" = 0 ]; then echo "Every waiting migration is safe to apply automatically."; exit 0; fi
          if [ "$code" = 1 ]; then
            echo "::error title=A waiting migration is destructive::It is not applied automatically. Check that the live app no longer uses what it removes, apply it by hand (scripts/prod-db.sh migrate --apply, runbook section 8), then run this workflow again."
            echo "$out"
            exit 1
          fi
          echo "::error title=Could not check the waiting migrations::The destructive-migration check could not read them, so nothing was applied. Output: $out"
          exit 1
      - name: Check the owner login is production's database
        if: steps.waiting.outputs.any == 'true'
        env:
          OWNER_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          READER_URL: ${{ secrets.MIGRATIONS_CHECK_URL }}
        run: node scripts/same-database.mjs
      - name: Back up production first
        if: steps.waiting.outputs.any == 'true'
        run: gcloud run jobs execute iron-log-backup --project "$PROJECT_ID" --region "$REGION" --wait
      - name: Apply the migrations to production
        if: steps.waiting.outputs.any == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx dbmate --no-dump-schema --migrations-dir db/migrations up
      - name: Check production has none left
        if: steps.waiting.outputs.any == 'true'
        env:
          MIGRATIONS_CHECK_URL: ${{ secrets.MIGRATIONS_CHECK_URL }}
        run: |
          if node scripts/db-pending.mjs; then echo "Production has every migration."; exit 0; fi
          echo "::error title=A migration is still waiting::The migrations ran but production still reports one waiting. Nothing was deployed. Check by hand: npm run prod:db -- pending."
          exit 1

      # The new revision is deployed with no traffic and checked on its own tagged address first (ADR 017): a revision that fails
      # never reaches a user, so there is nothing to roll back.
      - name: Build and deploy the new revision with no traffic
        id: candidate
        env:
          BUILD_SA: iron-log-build@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          # Production only: the custom domain people sign in on (a repository variable, empty until the domain is mapped). Empty keeps BASE_URL on the Cloud Run address.
          PUBLIC_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          scripts/deploy-cloud-run.sh candidate | tee "$RUNNER_TEMP/candidate.log"
          echo "url=$(sed -n 's/^CANDIDATE_URL=//p' "$RUNNER_TEMP/candidate.log")" >> "$GITHUB_OUTPUT"

      - name: Check the new revision before it gets any traffic
        run: |
          if scripts/ci-deploy.sh smoke "${{ steps.candidate.outputs.url }}"; then exit 0; fi
          echo "::error title=The new revision failed its check::It never received traffic; production still runs ${{ steps.live.outputs.revision }}."
          scripts/deploy-cloud-run.sh discard || true
          exit 1

      - name: Send traffic to the new revision
        run: scripts/deploy-cloud-run.sh promote

      - name: Check the live service, and roll back if it is not healthy
        run: |
          url="https://${SERVICE}-$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)').${REGION}.run.app"
          if scripts/ci-deploy.sh smoke "$url"; then exit 0; fi
          echo "::error title=The live service failed its check::Rolling back to ${{ steps.live.outputs.revision }}. Traffic stays on that revision until you run scripts/deploy-cloud-run.sh restore or deploy again."
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "${{ steps.live.outputs.revision }}=100"
          exit 1

  # Names the commit that just went live as the next pre-release (ADR 033, amending ADR 032). It runs only when every step above
  # passed, so a deploy that was stopped, failed its check or rolled back gets no release. It needs no approval of its own: the
  # `production` reviewer already approved the deploy.
  release:
    needs: deploy
    # `always()` because the default success() also looks at `staging`, which is skipped on a hand run with "skip staging" (or while
    # STAGING_ENABLED is not true) and would skip this job too. A deploy that did not succeed still gets no release.
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-26.04
    # Shares a lock with release-stage.yml, so two tags are never numbered at once.
    concurrency:
      group: release-tags
      cancel-in-progress: false
    permissions:
      contents: write # create the tag and the Release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # all tags
      - name: Release the commit that went live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          # The newest version tag, with a release (v1.0.0) sorting above its own pre-releases (v1.0.0-rc.2). Only a numbered stage tag
          # (v1.0.0-alpha.2) can be continued: after a general-availability tag, or with no numbered tag yet, a person picks the next version.
          last="$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | head -n1)"
          if ! echo "$last" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'; then
            echo "::notice title=Not releasing::The newest tag is '${last:-none}', which is not a numbered stage tag. Tag the next version by hand (ADR 032); deploys continue from it."
            exit 0
          fi
          # A deploy of a commit that already has a version (a re-run), or one that is not ahead of the last tag, adds nothing.
          if git tag --points-at "$sha" --list 'v*' | grep -q .; then
            echo "Commit ${sha:0:7} already has a release; nothing to do."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$last" "$sha"; then
            echo "::warning title=Not releasing::${sha:0:7} is not ahead of $last."
            exit 0
          fi
          next="${last%.*}.$(( ${last##*.} + 1 ))"
          gh release create "$next" --target "$sha" --title "$next" --generate-notes --notes-start-tag "$last"
          echo "### Released $next (${sha:0:7}), after $last" >> "$GITHUB_STEP_SUMMARY"
