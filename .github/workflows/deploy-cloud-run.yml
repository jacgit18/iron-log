name: Deploy to Cloud Run

# After a merge to main, once the Tests workflow has passed on that exact commit, builds the image and deploys it to Cloud Run
# (scripts/deploy-cloud-run.sh) as a revision with no traffic, checks it on its own address, and only then sends it traffic. If the live
# service fails its check afterwards it rolls back to the previous revision. The `production` environment's required reviewer
# approves each run (ADR 017).
#
# No keys are stored in GitHub: it signs in to Google with Workload Identity Federation, which only accepts this repository on the main
# branch (set up once by scripts/ci-deploy-setup.sh, which also prints the three repository variables this reads).
#
# It never touches the database. A new migration must be applied to production BEFORE the code that needs it (runbook section 8),
# so when migrations were added since the live revision it stops and says so. Apply them, then run this workflow by hand
# (Actions -> Deploy to Cloud Run -> Run workflow) and tick the box.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      migrations_applied:
        description: 'I have applied any new database migration to production (runbook section 8)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  # Says why the deploy below was skipped, so a forgotten pause is visible in the run summary.
  paused:
    if: github.event_name == 'workflow_run' && vars.DEPLOY_PAUSED == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### Deploys are paused (DEPLOY_PAUSED=true)" >> "$GITHUB_STEP_SUMMARY"
          echo "This merge was not deployed. To ship everything on main in one deploy: unpause with \`gh variable set DEPLOY_PAUSED --body false\`, then run \`gh workflow run deploy-cloud-run.yml --ref main\`." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Only a successful Tests run for a push to main of this repository, or a person starting it by hand on main.
    # A repository variable DEPLOY_PAUSED=true skips the automatic runs only; a person starting it by hand is never blocked.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && vars.DEPLOY_PAUSED != 'true' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings -> Environments -> production) to approve each deploy by hand.
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: us-central1
      SERVICE: iron-log
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit whose tests passed, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      # The revision that has the traffic, not the latest one: a candidate that failed its check is the latest but never served anyone.
      - name: What is live now
        id: live
        run: |
          revision="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json \
            | python3 -c 'import json,sys; t=json.load(sys.stdin)["status"]["traffic"]; print(max(t, key=lambda x: x.get("percent", 0))["revisionName"])')"
          # A revision keeps its image as a digest, so the commit is read from the COMMIT_SHA setting the deploy puts on it.
          sha="$(gcloud run revisions describe "$revision" --project "$PROJECT_ID" --region "$REGION" --format=json \
            | python3 -c 'import json,sys; e=json.load(sys.stdin)["spec"]["containers"][0].get("env", []); print(next((x.get("value", "") for x in e if x["name"] == "COMMIT_SHA"), ""))')"
          # Revisions made before COMMIT_SHA existed: the service keeps the image tag (the commit) of its LATEST revision, which is
          # the live one only when no newer revision has been made since.
          if [ -z "$sha" ] && [ "$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestCreatedRevisionName)')" = "$revision" ]; then
            image="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
            sha="${image##*:}"
          fi
          # Anything that is not a commit id leaves it empty, and the migration check then stops and says it cannot tell.
          case "$sha" in *[!0-9a-f]*) sha="";; esac
          {
            echo "sha=$sha"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"
          echo "Live: $revision (commit ${sha:-unknown})"

      - name: Stop if a migration is waiting
        if: ${{ !inputs.migrations_applied }}
        run: |
          set +e
          waiting="$(scripts/ci-deploy.sh pending-migrations "${{ steps.live.outputs.sha }}")"
          code=$?
          if [ "$code" = 3 ]; then
            echo "::error title=A database migration is waiting::These migrations were added since the live revision. Apply them to production first (runbook section 8), then run this workflow by hand and tick the box."
            echo "$waiting"
            exit 1
          elif [ "$code" != 0 ]; then
            echo "::error title=Cannot tell whether a migration is waiting::The live revision's commit is not in this checkout. Check by hand (runbook section 8), then run this workflow by hand and tick the box."
            exit 1
          fi
          echo "No migration waiting."

      # The new revision is deployed with no traffic and checked on its own tagged address first (ADR 017): a revision that fails
      # never reaches a user, so there is nothing to roll back.
      - name: Build and deploy the new revision with no traffic
        id: candidate
        env:
          BUILD_SA: iron-log-build@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          scripts/deploy-cloud-run.sh candidate | tee "$RUNNER_TEMP/candidate.log"
          echo "url=$(sed -n 's/^CANDIDATE_URL=//p' "$RUNNER_TEMP/candidate.log")" >> "$GITHUB_OUTPUT"

      - name: Check the new revision before it gets any traffic
        run: |
          if scripts/ci-deploy.sh smoke "${{ steps.candidate.outputs.url }}"; then exit 0; fi
          echo "::error title=The new revision failed its check::It never received traffic; production still runs ${{ steps.live.outputs.revision }}."
          scripts/deploy-cloud-run.sh discard || true
          exit 1

      - name: Send traffic to the new revision
        run: scripts/deploy-cloud-run.sh promote

      - name: Check the live service, and roll back if it is not healthy
        run: |
          url="https://${SERVICE}-$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)').${REGION}.run.app"
          if scripts/ci-deploy.sh smoke "$url"; then exit 0; fi
          echo "::error title=The live service failed its check::Rolling back to ${{ steps.live.outputs.revision }}. Traffic stays on that revision until you run scripts/deploy-cloud-run.sh restore or deploy again."
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "${{ steps.live.outputs.revision }}=100"
          exit 1
