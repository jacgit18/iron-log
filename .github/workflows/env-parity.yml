name: Environment parity

# Every day, and on demand (Actions -> Environment parity -> Run workflow, for example after a production migration): are production,
# staging and QA on the same migrations as main? Starts the Cloud Run job `iron-log-parity` once per environment (scripts/parity-run.sh);
# the job reads each database with a read-only login kept in Secret Manager, so this workflow holds no database credential.
# Red: an environment is AHEAD OF MAIN (it has a migration main lacks) or UNKNOWN (could not tell). Yellow: BEHIND (a warning).
# Plan: Projects/iron-log/specs/env-parity-report-plan.md; brief: briefs/env-parity-report.md.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: env-parity
  cancel-in-progress: false

jobs:
  parity:
    # The keyless Google login accepts this repository's main branch only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15 # timeout-ok: scheduled run takes about 7 min
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: us-central1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # the running-commit table counts commits between a service's commit and main's tip
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Compare each environment with main
        env:
          # Staging migrates on every merge to main (migrate-staging.yml), so a staging that is behind is a real problem: red.
          PARITY_STAGING_BEHIND: fail
        run: scripts/parity-run.sh
