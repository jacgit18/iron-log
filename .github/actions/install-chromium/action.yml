name: Install Chromium for Playwright
description: >
  `playwright install --with-deps` fetches about 21 MB from the Ubuntu mirror, normally in 20 s. On 2026-10-26 the mirror served 35 kB/s and one
  install took 10 minutes (13 of 52 shard runs took over 60 s). A stuck first attempt is cut off and tried once more, with a warning annotation so
  retries stay visible. Every workflow installs the browser through this action (scripts/playwrightInstallRetry.test.js).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        timeout 90 npx playwright install --with-deps chromium || {
          echo "::warning::playwright install did not finish in 90 s (slow apt mirror?); trying once more"
          # `timeout` stops npx but not the apt-get it started under sudo, which keeps the dpkg lock (run 40382012906: "dpkg frontend lock was locked by apt-get").
          sudo pkill -x apt-get || true
          for _ in $(seq 20); do pgrep -x apt-get > /dev/null || break; sleep 1; done
          sudo pkill -KILL -x apt-get || true
          sudo dpkg --configure -a
          timeout 180 npx playwright install --with-deps chromium
        }
