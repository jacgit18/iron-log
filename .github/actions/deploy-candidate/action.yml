name: Deploy a candidate revision
description: >-
  The steps the staging and QA deploys share (ADRs 058, 060): note what is live, build and deploy a revision with no traffic, check it, send
  traffic to it, check the live service and put the old revision back if that fails. The job sets PROJECT_ID, REGION, SERVICE, IRON_LOG_ENV
  and BUILD_SA (and CLOUDBUILD_CONFIG for QA) in its environment and signs in to Google first. Production keeps its own steps (they add the
  migration check, the approval and the release).

inputs:
  scripts:
    description: Absolute path of the folder with deploy-cloud-run.sh and ci-deploy.sh. QA passes main's copy, never the ref's.
    required: true
  working-directory:
    description: Absolute path of the folder Cloud Build takes the source from (the app checkout).
    required: true
  label:
    description: What to call the environment in messages (staging, QA).
    required: true
  failure-note:
    description: Added to the error messages.
    default: ''

outputs:
  url:
    description: The address of the live service after it passed its check.
    value: ${{ steps.livecheck.outputs.url }}

runs:
  using: composite
  steps:
    # The revision that has the traffic now, so a bad deploy can be put back. The first deploy of an environment is made by hand (runbook
    # sections 21 and 22), so the service exists by the time this runs.
    - name: What is live on ${{ inputs.label }} now
      id: live
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
      run: |
        if ! described="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)"; then
          echo "::error title=$LABEL is not set up yet::The service $SERVICE does not exist. Do the setup in the runbook first (the first deploy is made by hand)."
          exit 1
        fi
        revision="$(printf '%s' "$described" | python3 -c 'import json,sys; t=json.load(sys.stdin)["status"]["traffic"]; print(max(t, key=lambda x: x.get("percent", 0))["revisionName"])')"
        echo "revision=$revision" >> "$GITHUB_OUTPUT"
        echo "Live on $LABEL: $revision"

    - name: Build and deploy the ${{ inputs.label }} revision with no traffic
      id: candidate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPTS: ${{ inputs.scripts }}
      run: |
        "$SCRIPTS/deploy-cloud-run.sh" candidate | tee "$RUNNER_TEMP/candidate.log"
        echo "url=$(sed -n 's/^CANDIDATE_URL=//p' "$RUNNER_TEMP/candidate.log")" >> "$GITHUB_OUTPUT"

    - name: Check the ${{ inputs.label }} revision before it gets any traffic
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPTS: ${{ inputs.scripts }}
        LABEL: ${{ inputs.label }}
        NOTE: ${{ inputs.failure-note }}
        CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        PREVIOUS: ${{ steps.live.outputs.revision }}
      run: |
        if "$SCRIPTS/ci-deploy.sh" smoke "$CANDIDATE_URL"; then exit 0; fi
        echo "::error title=The $LABEL revision failed its check::It never received traffic; $LABEL still runs $PREVIOUS. $NOTE"
        "$SCRIPTS/deploy-cloud-run.sh" discard || true
        exit 1

    - name: Send traffic to the ${{ inputs.label }} revision
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPTS: ${{ inputs.scripts }}
        LABEL: ${{ inputs.label }}
        PREVIOUS: ${{ steps.live.outputs.revision }}
      run: |
        # A failure part-way (audit C-9) must not leave the candidate half-promoted: put the revision that was live back.
        if ! "$SCRIPTS/deploy-cloud-run.sh" promote; then
          echo "::error title=Sending traffic to the $LABEL revision failed::Putting $LABEL back on $PREVIOUS."
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$PREVIOUS=100"
          exit 1
        fi

    - name: Check the live ${{ inputs.label }} service
      id: livecheck
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPTS: ${{ inputs.scripts }}
        LABEL: ${{ inputs.label }}
        NOTE: ${{ inputs.failure-note }}
        PREVIOUS: ${{ steps.live.outputs.revision }}
      run: |
        url="https://${SERVICE}-$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)').${REGION}.run.app"
        if ! "$SCRIPTS/ci-deploy.sh" smoke "$url"; then
          echo "::error title=The live $LABEL service failed its check::Putting $LABEL back on $PREVIOUS. $NOTE"
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$PREVIOUS=100"
          exit 1
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
