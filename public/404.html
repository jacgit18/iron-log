<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="description" content="This address does not exist. Go to Loadbearer.">
<title>Page not found · Loadbearer</title>
<style>
  /* A narrow text page: the 46rem cap is the readable width, not the app's 1920 px container. */
  :root { --bg:#EEF0EC; --fg:#16201f; --muted:#4a5a58; --accent:#7A5C00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10181a; --fg:#e8eeec; --muted:#a6b5b2; --accent:#7fd0cb; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:46rem; margin:0 auto; padding:3rem 1rem 4rem; }
  h1 { font-size:1.8rem; line-height:1.2; margin:.2rem 0 .3rem; }
  p { max-width:70ch; }
  a.go { display:inline-flex; align-items:center; min-height:44px; padding:0 1rem; border:2px solid var(--accent); border-radius:.5rem; font-weight:600; text-decoration:none; color:var(--accent); }
  a.go:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<main>
<h1>Page not found</h1>
<p>That address does not exist.</p>
<a class="go" href="/">Go to Loadbearer</a>
</main>
</body>
</html>
