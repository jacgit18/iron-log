# Builds the parity job image (parity/Dockerfile) and pushes it to Artifact Registry. Used by scripts/parity-job.sh.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'parity/Dockerfile', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
substitutions:
  _IMAGE: ''
options:
  logging: CLOUD_LOGGING_ONLY
